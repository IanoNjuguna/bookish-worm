name: Design & Build

on:
  push:
    branches: [main, growth-hacking]
    paths: ['frontend/**', 'DESIGN.md', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'DESIGN.md']

jobs:
  app:
    name: App — design-lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
      - name: Design rules (DESIGN.md)
        run: npm run lint:design
      - name: Build
        run: npm run build

  home:
    name: Home — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/home/package-lock.json
      - run: npm ci
      - run: npm run build
