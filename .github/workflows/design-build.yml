name: Design & Build

on:
  push:
    branches: [main, growth-hacking]
    paths: ['frontend/**', 'DESIGN.md', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'DESIGN.md']

jobs:
  app:
    name: App — design-lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Design rules (DESIGN.md)
        run: bun run lint:design
      - name: Build
        run: bun run build

  home:
    name: Home — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/home
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bun run build
